name: Pages

# Builds the site (mason363.github.io/NumPlay: the README and docs, with Jekyll, as GitHub Pages
# did on its own) and deploys it, with the README's downloads, stars and version badges made from
# GitHub's numbers (tools/badges.py), and NumPlay Studio (customize/) with the kit Build leaves on
# the branch "kit". On each push to main, every six hours so the numbers stay fresh, and after each
# release or new kit (Build starts it).

on:
  push:
    branches: [main, 'feature/console-themes']
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count)
          downloads=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].assets[].download_count' | awk '{s += $1} END {print s + 0}')
          if gh release view --json tagName --jq .tagName >/dev/null 2>&1; then version=$(gh release view --json tagName --jq .tagName); else version=$(tr -d '[:space:]' < VERSION); fi
          python3 tools/badges.py --downloads "$downloads" --stars "$stars" --version "$version" --out docs/badges
          cat docs/badges/*.json
      - name: NumPlay Studio's kit
        run: |
          mkdir -p customize/kit
          # The Build workflow publishes the kit as soon as its build job succeeds.
          # Pages can start from the same push, so wait briefly for that branch.
          for attempt in $(seq 1 30); do
            if git fetch -q --depth 1 origin kit 2>/dev/null; then
              git archive FETCH_HEAD | tar -x -C customize/kit
              if test -s customize/kit/kit.json; then break; fi
            fi
            rm -rf customize/kit/*
            echo "Waiting for the generated kit ($attempt/30)..."
            sleep 20
          done
          test -s customize/kit/kit.json
          ls customize/kit
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
